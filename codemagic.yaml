# codemagic.yaml
# CI/CD pipeline for building the B2YDanmaku iOS jailbreak tweak.
# This pipeline:
#   1. Installs Theos + iPhoneOS SDK on a macOS builder.
#   2. Builds the .deb for three jailbreak flavours:
#        - rootful   (legacy: unc0ver, checkra1n)
#        - rootless  (Dopamine, palera1n)
#        - roothide  (RootHide Bootstrap)
#   3. Publishes every .deb as a downloadable artifact.
#
# Trigger: push to main, or manual "Start new build" in the Codemagic UI.
#
# Prerequisites:
#   - A Codemagic team with a macOS-based build machine (M1 or Intel).
#   - No code signing required (jailbreak tweaks are unsigned .deb files).
#
# Notes on SDK availability:
#   Theos needs an iPhoneOS SDK. Apple stopped shipping the private SDK
#   with Xcode years ago, so we download a known-good copy from the
#   Theos SDKs mirror (https://github.com/theos/sdks). The pipeline pins
#   to iPhoneOS16.5.sdk which supports arm64e and the YouTube app's
#   minimum deployment target.

workflows:
  b2y-danmaku-build:
    name: B2Y Danmaku Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        # Theos install location - using user home directory to avoid permission issues.
        THEOS: $HOME/theos
        # Target iOS SDK Version (consistent across download and build steps)
        B2Y_SDK_VER: "16.5"
        # Tweak version - bump on release.
        TWEAK_VERSION: "1.0.0"
      xcode: latest
    cache:
      cache_paths:
        # Cache the entire Theos directory, including downloaded SDKs
        - $HOME/theos
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Print environment
        script: |
          echo "=== Build environment ==="
          uname -a
          sw_vers
          xcodebuild -version || true
          echo "THEOS=$THEOS"
          echo "B2Y_SDK_VER=$B2Y_SDK_VER"
          echo "TWEAK_VERSION=$TWEAK_VERSION"

      - name: Install Theos
        script: |
          # Ensure THEOS is set for this script context
          export THEOS="$HOME/theos"
          
          if [ ! -d "$THEOS" ]; then
            echo "Cloning Theos to $THEOS ..."
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          else
            echo "Theos already present at $THEOS, updating ..."
            cd "$THEOS"
            git pull --ff-only || true
            git submodule update --init --recursive || true
          fi

      - name: Prepare iPhone SDK
        script: |
          #!/bin/bash
          set -e
          echo "=== 3/6 准备 iPhone SDK ==="

          # Explicitly set THEOS path to match environment vars
          export THEOS="$HOME/theos"
          SDK_DIR="$THEOS/sdks"
          SDK_NAME="iPhoneOS${B2Y_SDK_VER}.sdk"
          TEMP_DIR=$(mktemp -d)

          echo "📂 Theos 路径: $THEOS"
          echo "📂 目标 SDK: $SDK_NAME"
          
          mkdir -p "$SDK_DIR"

          if [ -d "$SDK_DIR/$SDK_NAME" ]; then
            echo "✅ SDK $SDK_NAME 已存在，跳过下载。"
            rm -rf "$TEMP_DIR"
            exit 0
          fi

          echo "📥 正在从 Github 下载 SDK..."
          # Using git clone to fetch the specific SDK from theos/sdks mirror
          if git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_DIR/sdks"; then
             echo "📥 正在复制 SDK 到 $SDK_DIR ..."
             cp -R "$TEMP_DIR/sdks/$SDK_NAME" "$SDK_DIR/" && echo "✅ SDK 复制完成"
          else
             echo "❌ 克隆 SDK 仓库失败"
             rm -rf "$TEMP_DIR"
             exit 1
          fi

          rm -rf "$TEMP_DIR"
          ls -la "$SDK_DIR/"

      - name: Verify Theos toolchain
        script: |
          export THEOS="$HOME/theos"
          echo "=== Theos toolchain check ==="
          ls "$THEOS/toolchain"
          cat "$THEOS/commit-hash" 2>/dev/null || true

      - name: Install ldid
        script: |
          echo "=== Installing ldid for code signing ==="
          # Check if Homebrew is installed
          if ! command -v brew &> /dev/null; then
            echo "Homebrew not found, installing..."
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          else
            echo "Homebrew is already installed"
          fi
          
          # Update Homebrew and install ldid
          echo "Updating Homebrew..."
          brew update
          
          echo "Installing ldid..."
          brew install ldid
          
          # Verify installation
          if command -v ldid &> /dev/null; then
            echo "✅ ldid installed successfully"
          else
            echo "❌ Failed to install ldid"
            exit 1
          fi

      - name: Build (rootful)
        script: |
          export THEOS="$HOME/theos"
          cd "$CM_BUILD_DIR"
          echo "=== Building rootful .deb (SDK=$B2Y_SDK_VER) ==="
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootful B2Y_SDK_VER="$B2Y_SDK_VER"
          find . -name "*.deb" -print

      - name: Build (rootless)
        script: |
          export THEOS="$HOME/theos"
          cd "$CM_BUILD_DIR"
          echo "=== Building rootless .deb (SDK=$B2Y_SDK_VER) ==="
          make clean || true
          make package FINALPACKAGE=1 ROOTLESS=1 B2Y_SDK_VER="$B2Y_SDK_VER"
          find . -name "*.deb" -print

      - name: Build (roothide)
        script: |
          export THEOS="$HOME/theos"
          cd "$CM_BUILD_DIR"
          echo "=== Building roothide .deb (SDK=$B2Y_SDK_VER) ==="
          make clean || true
          make package FINALPACKAGE=1 ROTHIDE=1 B2Y_SDK_VER="$B2Y_SDK_VER"
          find . -name "*.deb" -print

      - name: Collect artifacts
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cd "$CM_BUILD_DIR"
          for deb in packages/*.deb; do
            if [ -f "$deb" ]; then
              cp "$deb" artifacts/
              echo "Collected: $deb"
            fi
          done
          ls -la artifacts/

    artifacts:
      - artifacts/*.deb
      - packages/*.deb

    publishing:
      scripts:
        - name: Print build summary
          script: |
            echo "=== Build complete ==="
            echo "Artifacts:"
            ls -la "$CM_BUILD_DIR/artifacts/" 2>/dev/null || true
            echo ""
            echo "To install on a jailbroken device:"
            echo "  1. Download the .deb matching your jailbreak type."
            echo "  2. Transfer to your device (AirDrop, Filza, scp, ...)."
            echo "  3. Install with: dpkg -i <file.deb>  (rootful/roothide)"
            echo "     or via Sileo by adding the file as a local source."
            echo "  4. Respring."
            echo "  5. Open YouTube -> Settings -> B2Y Danmaku."
